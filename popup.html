<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>X 원본 미디어 다운로더</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="title-row">
        <span class="badge">ORIG</span>
        <h1>X 원본 미디어 다운로더</h1>
      </div>
    </header>

    <form id="settings-form" class="form">
      <div class="field base-folder-field">
        <label class="checkbox-label">
          <input type="checkbox" id="useBaseFolder" name="useBaseFolder" />
          <span>공통 상위 폴더 안에 프리셋 저장</span>
        </label>
        <input
          type="text"
          id="baseFolderPath"
          name="baseFolderPath"
          placeholder="상위 폴더명 또는 경로 (예: X_Images, 그림/트위터)"
          autocomplete="off"
        />
      </div>

      <div class="field">
        <div class="field-head">
          <label>저장 폴더 프리셋 (기본 선택: 좌클릭 저장 폴더)</label>
          <button type="button" class="btn-link" id="addPresetBtn">+ 추가</button>
        </div>
        <div id="presetList" class="preset-list"></div>
        <p class="hint">
          다운로드 폴더 안에 만들 폴더명입니다. 이미 있는 폴더면 그 안에 바로 저장됩니다. (비워두면 다운로드 폴더에 직접 저장)
        </p>
      </div>

      <div class="field">
        <label for="clickMode">트윗 버튼 동작 방식</label>
        <select id="clickMode" name="clickMode">
          <option value="instant_hover">좌클릭 즉시 저장 + 호버/우클릭으로 프리셋 선택</option>
          <option value="always_menu">좌클릭할 때마다 버튼 위에 프리셋 메뉴 열기</option>
        </select>
      </div>

      <div class="field checkbox-field">
        <label class="checkbox-label">
          <input type="checkbox" id="rememberPreset" name="rememberPreset" />
          <span>메뉴에서 고른 프리셋을 기본값으로 기억</span>
        </label>
      </div>

      <div class="field checkbox-field">
        <label class="checkbox-label">
          <input type="checkbox" id="subfolderByUser" name="subfolderByUser" />
          <span>작성자(@아이디)별 하위 폴더 자동 생성</span>
        </label>
      </div>

      <div class="field checkbox-field">
        <label class="checkbox-label">
          <input type="checkbox" id="convertGif" name="convertGif" />
          <span>GIF를 실제 .gif 파일로 변환하여 저장</span>
        </label>
      </div>

      <div class="field">
        <label for="filenamePattern">파일명 형식</label>
        <select id="filenamePattern" name="filenamePattern">
          <option value="user_id_index">@아이디_트윗ID_순번 (예: user_12345_01.jpg)</option>
          <option value="id_index">트윗ID_순번 (예: 12345_01.jpg)</option>
          <option value="media_id">원본 미디어 ID (예: GbXyz123.jpg)</option>
        </select>
      </div>

      <div class="preview-box">
        <span class="preview-label">기본 프리셋 저장 경로 미리보기</span>
        <code id="pathPreview" class="preview-path">다운로드/X_Images/user_1850000000000000000_01.jpg</code>
      </div>

      <div class="actions">
        <button type="submit" class="btn btn-primary" id="saveBtn">설정 저장</button>
        <button type="button" class="btn btn-secondary" id="openFolderBtn">폴더 열기</button>
      </div>

      <div id="statusMsg" class="status" role="status" aria-live="polite"></div>
    </form>

    <footer class="footer">
      <span>누적 다운로드: <strong id="downloadCount">0</strong>장</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
